<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta property="og:title" content="偉哥老師錯題講解・國三">
<meta property="og:description" content="國三理化錯題講解・答錯一步一步教你">
<meta property="og:image" content="https://a0982387879-glitch.github.io/APEX-WEI/teacher_card.jpg">
<meta property="og:type" content="website">
<title>偉哥老師錯題講解・國三</title>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：上方題目卡、下方「老師＋白板」講解區；手機單欄 */
:root {
  --bg: #eef2f1; --paper: #ffffff; --ink: #1d2a2e; --muted: #5d6d70; --line: #d5dedc;
  --board: #fbfdfc; --board-edge: #9aa9a6; --marker-blue: #1f4fa3; --marker-red: #c23a2b;
  --accent: #1f6f5c; --accent-ink: #ffffff; --good: #2e7d4f; --bad: #c23a2b; --chip: #e3ebe9;
  --f-board: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #142022; --paper: #1c2b2e; --ink: #e6efed; --muted: #9db0ad; --line: #2e4245;
  --board: #22343a; --board-edge: #4d6569; --marker-blue: #8fb6ff; --marker-red: #ff8a7a;
  --accent: #4fb89a; --accent-ink: #0d1b1d; --good: #6cd197; --bad: #ff8a7a; --chip: #26393c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #142022; --paper: #1c2b2e; --ink: #e6efed; --muted: #9db0ad; --line: #2e4245;
  --board: #22343a; --board-edge: #4d6569; --marker-blue: #8fb6ff; --marker-red: #ff8a7a;
  --accent: #4fb89a; --accent-ink: #0d1b1d; --good: #6cd197; --bad: #ff8a7a; --chip: #26393c; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; padding: 16px; padding-block: 20px 40px }
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 16px }
h1 { font-family: var(--f-board); font-size: 1.7rem; margin: 0; text-wrap: balance }
h2 { font-size: 1.1rem; margin: 0 }
.muted { color: var(--muted); font-size: .9rem }
button { font: inherit; cursor: pointer }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.btn { border: 0; border-radius: 10px; padding: .65rem 1.1rem; background: var(--accent); color: var(--accent-ink); font-weight: 700 }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line) }
.btn:disabled { opacity: .45; cursor: default }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.spacer { flex: 1 }

/* 首頁 */
.hello { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center }
.tcard { width: 200px; max-width: 100%; border-radius: 12px; display: block; box-shadow: 0 6px 18px color-mix(in srgb, var(--ink) 18%, transparent) }
.sets { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)) }
.set { text-align: left; background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; padding: 16px; color: var(--ink); display: grid; gap: 4px }
.set:hover { border-color: var(--accent) }
.set b { font-size: 1.1rem }
.set .prog { font-size: .85rem; color: var(--accent); font-weight: 700 }
label.name { display: grid; gap: 6px; font-weight: 500 }
label.name input { font: inherit; padding: .55rem .75rem; border-radius: 10px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); max-width: 260px }

/* 作答 */
.bar { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s }
.qimg { width: 100%; max-width: 520px; display: block; margin: 0 auto; border-radius: 8px; background: #fff; border: 1px solid var(--line) }
.opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px }
.opt { padding: .8rem 0; font-size: 1.2rem; font-weight: 700; border-radius: 12px; border: 2px solid var(--line); background: var(--paper); color: var(--ink) }
.opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.dots { display: flex; flex-wrap: wrap; gap: 6px }
.dot { width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); font-size: .8rem; font-variant-numeric: tabular-nums }
.dot.done { background: var(--chip); border-color: var(--accent) }
.dot.cur { outline: 2px solid var(--accent) }
.dot.wrong { background: var(--bad); border-color: var(--bad); color: #fff }
.dot.right { background: var(--good); border-color: var(--good); color: #fff }

/* 成績 */
.score { display: flex; align-items: baseline; gap: 10px; font-family: var(--f-board) }
.score .big { font-size: 3.2rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1 }

/* 老師講解 */
.teach { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: start }
.teacher { display: grid; justify-items: center; gap: 6px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px) }
.avatar { width: 112px; height: 112px; border-radius: 50%; overflow: hidden; border: 3px solid var(--accent); background: var(--chip); transform-origin: 50% 90% }
.avatar img, .avatar svg { width: 100%; height: 100%; object-fit: cover; display: block }
.teacher.talking .avatar { animation: nod 1.1s ease-in-out infinite }
@keyframes nod { 0%,100% { transform: rotate(0) } 30% { transform: rotate(-3deg) translateY(-2px) } 60% { transform: rotate(2deg) } }
.tname { font-family: var(--f-board); font-weight: 700; font-size: 1.05rem }
.board { background: var(--board); border: 6px solid var(--board-edge); border-radius: 10px; padding: 16px 18px; min-width: 0; font-family: var(--f-board); font-size: 1.18rem; line-height: 1.75; display: grid; gap: 10px;
  background-image: linear-gradient(transparent 95%, color-mix(in srgb, var(--board-edge) 18%, transparent) 95%); background-size: 100% 2.05em }
.board .say { color: var(--muted); font-family: var(--f-body); font-size: .95rem }
.board .step { display: grid; grid-template-columns: 1.8em 1fr; gap: 4px }
.board .step .n { color: var(--marker-blue); font-weight: 700 }
.board .step.writing .t { animation: write .9s steps(24, end) both }
@keyframes write { from { clip-path: inset(0 100% 0 0) } to { clip-path: inset(0 0 0 0) } }
.board b { color: var(--marker-blue) }
.board em { color: var(--marker-red); font-style: normal; font-weight: 700; background: linear-gradient(transparent 62%, color-mix(in srgb, var(--marker-red) 22%, transparent) 62%) }
.board .key { border-top: 2px dashed var(--board-edge); padding-top: 10px; color: var(--marker-red); font-weight: 700 }
.board .key::before { content: "記住："; color: var(--ink) }
.verdict { display: flex; gap: 8px; flex-wrap: wrap; font-family: var(--f-body); font-size: .95rem }
.pill { padding: .15rem .6rem; border-radius: 99px; font-weight: 700 }
.pill.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad) }
.pill.good { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good) }
audio { width: 100% }
.code { display: block; padding: 10px 12px; border-radius: 10px; background: var(--chip); font-size: .85rem; word-break: break-all; user-select: all }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 4px }
textarea { font: inherit; font-size: .9rem; width: 100%; padding: 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); resize: vertical }
.tbl { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: .92rem }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap }
th { color: var(--muted); font-weight: 500 }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums }
.rate { display: inline-block; width: 70px; height: 8px; border-radius: 99px; background: var(--chip); vertical-align: middle; overflow: hidden }
.rate i { display: block; height: 100%; background: var(--bad) }
@media (max-width: 560px) {
  .teach { grid-template-columns: 1fr }
  .teacher { position: static; grid-template-columns: auto 1fr; justify-items: start; align-items: center; gap: 10px }
  .avatar { width: 64px; height: 64px }
  .board { font-size: 1.08rem; padding: 12px 14px }
  .hello { grid-template-columns: 1fr; justify-items: center }
  .tcard { width: 240px }
}
@media (prefers-reduced-motion: reduce) { .teacher.talking .avatar, .board .step.writing .t { animation: none } .bar i { transition: none } }
</style>

<div class="wrap" id="app"></div>

<template id="avatar-svg">
  <svg viewBox="0 0 120 120" role="img" aria-label="老師頭像">
    <rect width="120" height="120" fill="var(--chip)"/>
    <path d="M22 120c4-26 20-38 38-38s34 12 38 38z" fill="var(--accent)"/>
    <path d="M52 84l8 12 8-12z" fill="var(--paper)"/>
    <circle cx="60" cy="54" r="26" fill="#f2d2b6"/>
    <path d="M34 50c0-18 12-28 26-28s26 10 26 26c-6-8-16-12-26-12s-20 6-26 14z" fill="#2b2522"/>
    <circle cx="50" cy="56" r="8" fill="none" stroke="#2b2522" stroke-width="2.5"/>
    <circle cx="70" cy="56" r="8" fill="none" stroke="#2b2522" stroke-width="2.5"/>
    <path d="M58 56h4" stroke="#2b2522" stroke-width="2.5"/>
    <circle cx="50" cy="56" r="2.2" fill="#2b2522"/><circle cx="70" cy="56" r="2.2" fill="#2b2522"/>
    <path d="M52 68q8 6 16 0" fill="none" stroke="#8a4a3a" stroke-width="2.5" stroke-linecap="round"/>
  </svg>
</template>

<script src="data.js"></script>
<script>
// ===== 老師設定：換成自己的名字；照片放 teacher.jpg；錄音放 audio/g8_01.mp3 這種檔名，並在 AUDIO 列出 =====
const TEACHER = { name: "偉哥老師", photo: "teacher.jpg", card: "teacher_card.jpg" };
// 這個網頁只放哪個年級的考卷（index_g9.html 由 make_g9.py 從這個檔產生，改這裡之後要重跑）
const GRADE = "國三", SHOW = ["g9", "g9b", "g9c", "g9d", "g9e", "g9f", "g9g", "g9h", "g9i"];
for (const k of Object.keys(QUIZ)) if (!SHOW.includes(k)) delete QUIZ[k];
const AUDIO = [];   // 例如 ["g8_01", "g9_12"]，有錄音的題目才會出現「聽老師講」

const $ = (s, el = document) => el.querySelector(s);
const app = $("#app");
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
let state = { view: "home", set: null, i: 0, answers: {}, submitted: false, wrongIdx: 0, step: 0 };
const pad = n => String(n).padStart(2, "0");
const imgOf = (set, n) => `img/${set}_${pad(n)}.png`;

function avatarHTML() {
  return `<div class="avatar"><img src="${TEACHER.photo}" alt="${TEACHER.name}" onerror="this.replaceWith(document.getElementById('avatar-svg').content.firstElementChild.cloneNode(true))"></div>`;
}
function load(set) {
  const saved = store.get("quiz_" + set, null);
  state = { view: saved && saved.submitted ? "result" : "quiz", set, i: 0, answers: saved ? saved.answers : {}, submitted: !!(saved && saved.submitted), wrongIdx: 0, step: 0 };
  render();
}
function save() { store.set("quiz_" + state.set, { answers: state.answers, submitted: state.submitted }) }
function wrongList() { const qs = QUIZ[state.set].qs; return qs.map((q, k) => k).filter(k => state.answers[k] !== qs[k].ans) }

function render() {
  window.scrollTo(0, 0);
  if (state.view === "home") return renderHome();
  if (state.view === "quiz") return renderQuiz();
  if (state.view === "result") return renderResult();
  if (state.view === "teach") return renderTeach();
  if (state.view === "teacher") return renderTeacher();
}
window.addEventListener("hashchange", () => { if (location.hash === "#teacher") { state.view = "teacher"; render() } });
if (location.hash === "#teacher") state.view = "teacher";

function renderHome() {
  const name = store.get("student", "");
  app.innerHTML = `
    <div class="card hello">
      <img class="tcard" src="${TEACHER.card}" alt="${TEACHER.name}的角色卡">

      <div style="min-width:0;display:grid;gap:6px">
        <h1>${TEACHER.name}的錯題講解（${GRADE}）</h1>
        <p class="muted" style="margin:0">先把整份考卷寫完再交卷。交卷後，答錯的題目我會在白板上一步一步寫給你看，也會唸給你聽（記得打開手機音量）。</p>
        <label class="name">你的名字
          <input id="student" value="${name.replace(/"/g, "&quot;")}" placeholder="例如：王小明" autocomplete="name">
        </label>
      </div>
    </div>
    <h2>選一份考卷</h2>
    <div class="sets">
      ${Object.entries(QUIZ).map(([k, s]) => {
        const sv = store.get("quiz_" + k, null), done = sv ? Object.keys(sv.answers).length : 0;
        const tag = sv && sv.submitted ? "已交卷・看錯題講解" : done ? `已作答 ${done}／${s.qs.length} 題・繼續寫` : `${s.qs.length} 題`;
        return `<button class="set" data-set="${k}"><b>${s.title}</b><span class="muted">${s.sub}</span><span class="prog">${tag}</span></button>`;
      }).join("")}
    </div>`;
  app.insertAdjacentHTML("beforeend", `<div class="row"><span class="spacer"></span><button class="link" id="tzone">老師專區</button></div>`);
  $("#tzone").onclick = () => { state.view = "teacher"; render() };
  $("#student").addEventListener("input", e => store.set("student", e.target.value));
  app.querySelectorAll(".set").forEach(b => b.onclick = () => load(b.dataset.set));
}

function renderQuiz() {
  const S = QUIZ[state.set], q = S.qs[state.i], n = state.i + 1, total = S.qs.length;
  const done = Object.keys(state.answers).length, stem = S.stems && S.stems[n];
  app.innerHTML = `
    <div class="row"><button class="btn ghost" id="home">← 回首頁</button><span class="spacer"></span><span class="muted">${S.title}</span></div>
    <div class="card" style="display:grid;gap:12px">
      <div class="row"><h2>第 ${n} 題</h2><span class="spacer"></span><span class="muted">已作答 ${done}／${total}</span></div>
      <div class="bar"><i style="width:${done / total * 100}%"></i></div>
      ${stem ? `<img class="qimg" src="img/${stem}.png" alt="題組說明">` : ""}
      <img class="qimg" src="${imgOf(state.set, n)}" alt="第 ${n} 題題目">
      <div class="opts" role="group" aria-label="選擇答案">
        ${["A", "B", "C", "D"].map(o => `<button class="opt" data-o="${o}" aria-pressed="${state.answers[state.i] === o}">${o}</button>`).join("")}
      </div>
      <div class="row">
        <button class="btn ghost" id="prev" ${state.i === 0 ? "disabled" : ""}>上一題</button>
        <span class="spacer"></span>
        ${n < total ? `<button class="btn" id="next">下一題</button>` : `<button class="btn" id="submit">交卷</button>`}
      </div>
    </div>
    <div class="card" style="display:grid;gap:8px">
      <span class="muted">點題號可以跳題</span>
      <div class="dots">${S.qs.map((_, k) => `<button class="dot ${state.answers[k] ? "done" : ""} ${k === state.i ? "cur" : ""}" data-k="${k}">${k + 1}</button>`).join("")}</div>
      <div class="row"><span class="spacer"></span><button class="btn" id="submit2">交卷</button></div>
    </div>`;
  $("#home").onclick = () => { state.view = "home"; render() };
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    state.answers[state.i] = b.dataset.o; save();
    if (state.i < total - 1) { state.i++; } render();
  });
  app.querySelectorAll(".dot").forEach(b => b.onclick = () => { state.i = +b.dataset.k; render() });
  const p = $("#prev"); if (p) p.onclick = () => { state.i--; render() };
  const nx = $("#next"); if (nx) nx.onclick = () => { state.i++; render() };
  [$("#submit"), $("#submit2")].forEach(b => b && (b.onclick = () => trySubmit()));
}
function trySubmit() {
  const S = QUIZ[state.set], left = S.qs.length - Object.keys(state.answers).length;
  if (left > 0 && !state.confirmLeft) {
    state.confirmLeft = true;
    const box = document.createElement("div"); box.className = "card";
    box.innerHTML = `<p style="margin:0 0 10px">還有 <b>${left}</b> 題沒寫，沒寫的算錯。確定要交卷嗎？</p><div class="row"><button class="btn" id="yes">確定交卷</button><button class="btn ghost" id="no">回去繼續寫</button></div>`;
    app.appendChild(box); box.scrollIntoView({ behavior: "smooth" });
    $("#yes").onclick = () => { state.confirmLeft = false; submit() };
    $("#no").onclick = () => { state.confirmLeft = false; box.remove() };
    return;
  }
  submit();
}
function submit() { state.submitted = true; save(); state.view = "result"; render() }

function renderResult() {
  const S = QUIZ[state.set], wrong = wrongList(), right = S.qs.length - wrong.length;
  const score = Math.round(right * S.points * 10) / 10, who = store.get("student", "");
  app.innerHTML = `
    <div class="row"><button class="btn ghost" id="home">← 回首頁</button><span class="spacer"></span><span class="muted">${S.title}</span></div>
    <div class="card" style="display:grid;gap:12px">
      <div class="score"><span class="big">${score}</span><span>分</span><span class="spacer"></span><span class="muted">${who ? who + "・" : ""}答對 ${right}／${S.qs.length} 題</span></div>
      <div class="dots">${S.qs.map((q, k) => `<button class="dot ${state.answers[k] === q.ans ? "right" : "wrong"}" data-k="${k}" title="第 ${k + 1} 題">${k + 1}</button>`).join("")}</div>
      <span class="muted">紅色是答錯的題目，點一下就能看老師講解。</span>
    </div>
    <div class="card teach">
      <div class="teacher">${avatarHTML()}<span class="tname">${TEACHER.name}</span></div>
      <div class="board">
        ${wrong.length
          ? `<div>你錯了 <em>${wrong.length} 題</em>。別擔心，我們一題一題來看。</div><div class="row"><button class="btn" id="go">開始看錯題講解</button></div>`
          : `<div>全部答對，<em>太厲害了！</em>想再練一次可以按「重新作答」。</div>`}
      </div>
    </div>
    <div class="card" style="display:grid;gap:10px">
      <h2>把成績傳給${TEACHER.name}</h2>
      ${who ? "" : `<label class="name">先填你的名字<input id="who" placeholder="例如：王小明" autocomplete="name"></label>`}
      <p class="muted" style="margin:0">按「複製成績碼」，再貼到 LINE 傳給老師。</p>
      <code id="code" class="code">${who ? reportCode(who) : "（請先填名字）"}</code>
      <div class="row"><button class="btn" id="copy" ${who ? "" : "disabled"}>複製成績碼</button><span class="muted" id="copied" role="status"></span></div>
    </div>
    <div class="row"><button class="btn ghost" id="redo">重新作答</button></div>`;
  const whoIn = $("#who");
  if (whoIn) whoIn.addEventListener("input", e => {
    const v = e.target.value.trim(); store.set("student", v);
    $("#code").textContent = v ? reportCode(v) : "（請先填名字）"; $("#copy").disabled = !v;
  });
  $("#copy").onclick = () => {
    const t = $("#code").textContent, done = m => $("#copied").textContent = m;
    navigator.clipboard.writeText(t).then(() => done("已複製，到 LINE 貼上就好"), () => {
      const r = document.createRange(); r.selectNodeContents($("#code")); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      done("已選取成績碼，請長按或按 Ctrl+C 複製");
    });
  };
  $("#home").onclick = () => { state.view = "home"; render() };
  app.querySelectorAll(".dot.wrong").forEach(b => b.onclick = () => { state.wrongIdx = wrong.indexOf(+b.dataset.k); state.step = 0; state.view = "teach"; render() });
  const go = $("#go"); if (go) go.onclick = () => { state.wrongIdx = 0; state.step = 0; state.view = "teach"; render() };
  $("#redo").onclick = () => { state.answers = {}; state.submitted = false; state.i = 0; save(); state.view = "quiz"; render() };
}

// 成績碼：【偉哥老師成績】姓名｜考卷代號｜分數｜每題作答（- 表示沒寫）
function reportCode(name) {
  const S = QUIZ[state.set], right = S.qs.filter((q, k) => state.answers[k] === q.ans).length;
  const score = Math.round(right * S.points * 10) / 10;
  return `【${TEACHER.name}成績】${name.replace(/[｜|]/g, "")}｜${state.set}｜${score}分｜${S.qs.map((q, k) => state.answers[k] || "-").join("")}`;
}

// ===== 老師專區：貼上 LINE 聊天內容，整理全班成績與各題錯誤率 =====
function renderTeacher() {
  const saved = store.get("teacher_paste", "");
  app.innerHTML = `
    <div class="row"><button class="btn ghost" id="home">← 回首頁</button><span class="spacer"></span><span class="muted">老師專區</span></div>
    <div class="card" style="display:grid;gap:10px">
      <h2>整理全班成績</h2>
      <p class="muted" style="margin:0">把 LINE 裡學生傳來的成績碼整段複製貼到下面，聊天內容一起貼也沒關係。同一位學生傳很多次，只算最後一次。</p>
      <textarea id="paste" rows="6" placeholder="在這裡貼上 LINE 聊天內容">${saved.replace(/</g, "&lt;")}</textarea>
      <div class="row"><button class="btn ghost" id="clear">清空</button></div>
    </div>
    <div id="report" style="display:grid;gap:16px"></div>`;
  $("#home").onclick = () => { location.hash = ""; state.view = "home"; render() };
  const ta = $("#paste");
  ta.addEventListener("input", () => { store.set("teacher_paste", ta.value); buildReport(ta.value) });
  $("#clear").onclick = () => { ta.value = ""; store.set("teacher_paste", ""); buildReport("") };
  buildReport(saved);
}
function buildReport(text) {
  const re = /【[^】]*成績】([^｜\n]+)｜(g8b|g8|g9b|g9)｜([\d.]+)分｜([A-D-]+)/g, by = {};
  for (const m of text.matchAll(re)) {
    const [, name, set, , ans] = m;
    if (!QUIZ[set] || ans.length !== QUIZ[set].qs.length) continue;
    (by[set] = by[set] || {})[name.trim()] = ans;            // 同名只留最後一次
  }
  const out = $("#report");
  if (!Object.keys(by).length) { out.innerHTML = `<div class="card muted">還沒有找到成績碼。成績碼長這樣：【${TEACHER.name}成績】王小明｜g8｜72.5分｜CCBD…</div>`; return; }
  out.innerHTML = Object.entries(by).map(([set, people]) => {
    const S = QUIZ[set], names = Object.keys(people);
    const rows = names.map(n => { const a = people[n], r = S.qs.filter((q, k) => a[k] === q.ans).length;
      return { n, score: Math.round(r * S.points * 10) / 10, wrong: S.qs.map((q, k) => k).filter(k => a[k] !== S.qs[k].ans) } })
      .sort((x, y) => y.score - x.score);
    const avg = rows.reduce((s, r) => s + r.score, 0) / rows.length;
    const stats = S.qs.map((q, k) => {
      const picks = {}; let wrong = 0;
      names.forEach(n => { const c = people[n][k]; if (c !== q.ans) { wrong++; picks[c] = (picks[c] || 0) + 1 } });
      const top = Object.entries(picks).sort((a, b) => b[1] - a[1])[0];
      return { k, wrong, rate: wrong / names.length, top: top ? (top[0] === "-" ? "沒寫" : top[0]) + `（${top[1]} 人）` : "" };
    }).sort((a, b) => b.wrong - a.wrong || a.k - b.k);
    return `
      <div class="card" style="display:grid;gap:12px">
        <div class="row"><h2>${S.title}</h2><span class="spacer"></span><span class="muted">${names.length} 人・平均 ${avg.toFixed(1)} 分</span></div>
        <div class="tbl"><table>
          <thead><tr><th>姓名</th><th class="num">分數</th><th>錯的題號</th></tr></thead>
          <tbody>${rows.map(r => `<tr><td>${esc(r.n)}</td><td class="num">${r.score}</td><td>${r.wrong.map(k => k + 1).join("、") || "全對"}</td></tr>`).join("")}</tbody>
        </table></div>
        <h2>各題錯誤率（由高到低）</h2>
        <div class="tbl"><table>
          <thead><tr><th>題號</th><th class="num">答錯人數</th><th>錯誤率</th><th>正確答案</th><th>最多人選錯</th></tr></thead>
          <tbody>${stats.filter(s => s.wrong).map(s => `<tr><td>第 ${s.k + 1} 題</td><td class="num">${s.wrong}</td>
            <td><span class="rate"><i style="width:${s.rate * 100}%"></i></span> ${Math.round(s.rate * 100)}%</td>
            <td>${S.qs[s.k].ans}</td><td>${s.top}</td></tr>`).join("") || `<tr><td colspan="5">全班都答對了</td></tr>`}</tbody>
        </table></div>
      </div>`;
  }).join("");
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])) }

function renderTeach() {
  const S = QUIZ[state.set], wrong = wrongList(), k = wrong[state.wrongIdx], q = S.qs[k], n = k + 1;
  const mine = state.answers[k], stem = S.stems && S.stems[n], aid = `${state.set}_${pad(n)}`;
  const shown = q.steps.slice(0, state.step + 1), finished = state.step >= q.steps.length - 1;
  app.innerHTML = `
    <div class="row"><button class="btn ghost" id="back">← 回成績</button><span class="spacer"></span><span class="muted">錯題 ${state.wrongIdx + 1}／${wrong.length}</span></div>
    <div class="card" style="display:grid;gap:10px">
      <h2>第 ${n} 題</h2>
      ${stem ? `<img class="qimg" src="img/${stem}.png" alt="題組說明">` : ""}
      <img class="qimg" src="${imgOf(state.set, n)}" alt="第 ${n} 題題目">
    </div>
    <div class="card teach">
      <div class="teacher talking" id="t">${avatarHTML()}<span class="tname">${TEACHER.name}</span></div>
      <div class="board" aria-live="polite">
        <div class="verdict"><span class="pill bad">你選 ${mine || "沒寫"}</span><span class="pill good">正確答案 ${q.ans}</span></div>
        ${AUDIO.includes(aid) ? `<audio controls preload="none" src="audio/${aid}.mp3"></audio>` : ""}
        ${shown.map((s, j) => `<div class="step ${j === state.step ? "writing" : ""}"><span class="n">${j + 1}.</span><span class="t">${s}</span></div>`).join("")}
        ${finished ? `<div class="key">${q.key}</div>` : ""}
        <div class="row">
          ${!finished ? `<button class="btn" id="more">下一步</button><button class="btn ghost" id="all">全部顯示</button>`
            : (state.wrongIdx < wrong.length - 1 ? `<button class="btn" id="nextq">下一道錯題 →</button>` : `<button class="btn" id="end">講完了，回成績</button>`)}
          ${state.wrongIdx > 0 ? `<button class="btn ghost" id="prevq">上一道錯題</button>` : ""}
        </div>
        <div class="row voice">
          <button class="btn ghost" id="again">再唸一次</button>
          <button class="btn ghost" id="vt" aria-pressed="${VOICE.on}">${VOICE.on ? "聲音：開" : "聲音：關"}</button>
        </div>
      </div>
    </div>`;
  const cur = (state.step === 0 ? `你選${mine || "沒寫"}，正確答案是${q.ans}。` : "") + q.steps[state.step] + (finished ? "。記住：" + q.key : "");
  const clip = `audio/${aid}_${state.step + 1}.mp3`;
  if (VOICE.on) playStep(clip, cur);
  else setTimeout(() => { const t = $("#t"); if (t) t.classList.remove("talking") }, 1200);
  $("#again").onclick = () => { const on = VOICE.on; VOICE.on = true; playStep(clip, cur); VOICE.on = on };
  $("#vt").onclick = () => { VOICE.on = !VOICE.on; store.set("voice_on", VOICE.on); if (!VOICE.on) stopSpeak(); renderTeachKeepScroll() };
  $("#back").onclick = () => { stopSpeak(); state.view = "result"; render() };
  const more = $("#more"); if (more) more.onclick = () => { state.step++; renderTeachKeepScroll() };
  const all = $("#all"); if (all) all.onclick = () => { state.step = q.steps.length - 1; renderTeachKeepScroll() };
  const nq = $("#nextq"); if (nq) nq.onclick = () => { state.wrongIdx++; state.step = 0; render() };
  const pq = $("#prevq"); if (pq) pq.onclick = () => { state.wrongIdx--; state.step = 0; render() };
  const end = $("#end"); if (end) end.onclick = () => { stopSpeak(); state.view = "result"; render() };
}
function renderTeachKeepScroll() { const y = window.scrollY; renderTeach(); window.scrollTo(0, y) }

// ===== 男生聲音朗讀（用裝置內建的語音；優先挑中文男聲，沒有男聲就把女聲調低）=====
const VOICE = { on: store.get("voice_on", true), pick: null };
const MALE = /zhiwei|志偉|yunjhe|雲哲|yunxi|雲希|yunyang|雲揚|kangkang|康康|liang|male|男/i;
function pickVoice() {
  if (!("speechSynthesis" in window)) return null;
  const vs = speechSynthesis.getVoices().filter(v => /^(zh|cmn)/i.test(v.lang));
  const tw = vs.filter(v => /TW|Hant/i.test(v.lang + v.name));
  VOICE.pick = tw.find(v => MALE.test(v.name)) || vs.find(v => MALE.test(v.name)) || tw[0] || vs[0] || null;
  VOICE.male = !!(VOICE.pick && MALE.test(VOICE.pick.name));
  return VOICE.pick;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function toSpeech(html) {
  const t = html.replace(/<[^>]+>/g, "")
    .replace(/cm\/s²/g, "公分每平方秒").replace(/m\/s²/g, "公尺每平方秒").replace(/cm\/s/g, "公分每秒").replace(/m\/s/g, "公尺每秒")
    .replace(/(\d)\/(\d)/g, (m, a, b) => `${b}分之${a}`)
    .replace(/²/g, "平方").replace(/[₀-₉]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x2050)).replace(/（[−-]/g, "（負")
    .replace(/↖/g, "左上").replace(/↙/g, "左下").replace(/↗/g, "右上").replace(/↘/g, "右下").replace(/←/g, "向左")
    .replace(/(\d)\s*kgw/g, "$1公斤重")
    .replace(/÷/g, "除以").replace(/×/g, "乘").replace(/＝|=/g, "等於").replace(/[−-]/g, "減").replace(/＋|\+/g, "加")
    .replace(/≒/g, "約等於").replace(/～/g, "到").replace(/＞/g, "大於").replace(/＜/g, "小於").replace(/✔/g, "，正確")
    .replace(/([0-9A-Za-z甲乙丙])\s*：\s*(?=[0-9A-Za-z甲乙丙])/g, "$1比").replace(/：/g, "，").replace(/／/g, "每")
    .replace(/(\d)\s*kg/g, "$1公斤").replace(/(\d)\s*cm/g, "$1公分").replace(/(\d)\s*N\b/g, "$1牛頓").replace(/(\d)\s*g\b/g, "$1公克").replace(/(\d)\s*m\b/g, "$1公尺")
    .replace(/→/g, "，所以").replace(/λ/g, "波長").replace(/\(([A-D])\)/g, "$1選項").replace(/°C|℃/g, "度");
  return t;
}
function speak(html) {
  if (!VOICE.on || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(toSpeech(html));
  const v = VOICE.pick || pickVoice();
  if (v) { u.voice = v; u.lang = v.lang } else u.lang = "zh-TW";
  u.rate = 0.95; u.pitch = VOICE.male ? 1 : 0.6;   // 沒有男聲時把音調壓低
  const t = document.getElementById("t");
  u.onstart = () => t && t.classList.add("talking");
  u.onend = u.onerror = () => { const t2 = document.getElementById("t"); t2 && t2.classList.remove("talking") };
  speechSynthesis.speak(u);
}
// 優先播放預先錄好的男聲 mp3（audio/g8_01_1.mp3＝國二第 1 題第 1 行）；載入失敗才改用裝置語音
const player = new Audio();
function playStep(src, fallbackHtml) {
  if (!VOICE.on) return;
  stopSpeak();
  const talk = on => { const t = document.getElementById("t"); t && t.classList.toggle("talking", on) };
  player.onplay = () => talk(true);
  player.onended = player.onpause = () => talk(false);
  player.onerror = () => speak(fallbackHtml);
  player.src = src;
  player.play().catch(err => { if (err && err.name !== "AbortError") speak(fallbackHtml) });
}
function stopSpeak() { try { player.pause() } catch {} if ("speechSynthesis" in window) speechSynthesis.cancel() }

render();
</script>
